<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trợ lý AI - Experience Lab</title><link rel="stylesheet" href="style.css"><script src="https://js.puter.com/v2/"></script><script>let history=JSON.parse(localStorage.getItem('experienceAIChat')||'[]');function add(t,w,save=true){let c=document.getElementById('chat'),d=document.createElement('div');d.className='msg '+w;d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight;if(save){history.push({t,w});localStorage.setItem('experienceAIChat',JSON.stringify(history))}return d}window.addEventListener('DOMContentLoaded',()=>history.forEach(x=>add(x.t,x.w,false)));async function sendAI(q){let i=document.getElementById('aiInput');q=q||i.value.trim();if(!q)return;add(q,'user');i.value='';let w=add('AI đang suy nghĩ...','bot',false);try{const r=await puter.ai.chat([{role:'system',content:'Bạn là trợ lý học tập Experience Lab. Trả lời tiếng Việt rõ ràng, an toàn, dễ hiểu và ưu tiên hướng dẫn từng bước.'},{role:'user',content:q}],{model:'gpt-5.6-luna',normalize:true});let a=r?.message?.content||String(r);w.textContent=a;history.push({t:a,w:'bot'});localStorage.setItem('experienceAIChat',JSON.stringify(history))}catch(e){w.textContent='Chưa kết nối được AI. Hãy thử lại hoặc đăng nhập nếu hệ thống yêu cầu.'}}function clearChat(){history=[];localStorage.removeItem('experienceAIChat');document.getElementById('chat').innerHTML='<div class="msg bot">Lịch sử đã được xóa. Bạn muốn hỏi gì?</div>'}</script></head><body><div class="app"><aside class="side"><div class="brand">EXPERIENCE LAB</div><nav class="nav"><a class="" href="index.html">Trang chủ</a><a class="" href="about.html">Giới thiệu</a><a class="" href="activities.html">Hoạt động</a><a class="active" href="ai.html">Trợ lý AI</a><a class="" href="stats.html">Thống kê</a><a class="" href="mission.html">Nhiệm vụ</a><a class="" href="support.html">Hỗ trợ</a></nav><div class="profile"><b>Hồ sơ học tập</b><div style="margin-top:7px"><span data-level>Cấp 3</span> · <span data-xp>240 XP</span></div><div class="muted" style="color:#b9d0d8;margin-top:4px">🔥 <span data-streak>5 ngày</span> liên tiếp</div></div></aside><main class="main"><div class="topbar"><div><h1>Trợ lý AI</h1><p class="muted">Hỏi về ý tưởng dự án, STEM hoặc kế hoạch học tập.</p></div><span class="pill">AI ONLINE</span></div><div class="quick"><button onclick="sendAI('Gợi ý cho tôi một hoạt động STEM đơn giản')">🔬 Gợi ý STEM</button><button onclick="sendAI('Cho tôi ý tưởng dự án cộng đồng')">🤝 Dự án cộng đồng</button><button onclick="sendAI('Lập kế hoạch học tập cho hôm nay')">📅 Kế hoạch hôm nay</button><button onclick="clearChat()">🗑️ Xóa chat</button></div><div id="chat" class="chat"><div class="msg bot">Xin chào! Mình là trợ lý AI của Experience Lab. Bạn cần mình hỗ trợ gì?</div></div><div class="row"><input id="aiInput" placeholder="Nhập câu hỏi..." onkeydown="if(event.key==='Enter')sendAI()"><button class="btn" onclick="sendAI()">Gửi</button></div></main></div><script src="app.js"></script></body></html>
